name: Build and deploy

# Push to main -> build the image, push ghcr.io/robticorg/robtic-landing:production (+ a short-sha tag),
# then ping the Portainer stack's auto-update webhook so the host re-pulls and redeploys. Mirrors the other
# robticorg services.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip deploy')"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/robticorg/robtic-landing
          tags: |
            type=raw,value=production
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Portainer re-pulls `:production` and recreates robtic-landing if its image changed — the same as the bots
  # (robtic-staff, robtic-shop…). The webhook is reachable on the LAN only, so this runs on the self-hosted runner on
  # the server (192.168.1.137). PORTAINER_WEBHOOK is this repo's secret: the robtic-landing stack's webhook URL.
  redeploy:
    name: Redeploy robtic-landing
    needs: build
    runs-on: [self-hosted, robtic-deploy]
    steps:
      # Pulls the new images and recreates the containers straight from the runner (it sits on the server), with the
      # same stack files Portainer deploys from. Portainer's webhook said "success" without pulling, or pulled minutes
      # later. The job succeeds only when every service runs the image it just pulled.
      - name: Pull the new images and recreate the containers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          STACK_DIR: /data/compose/5/v1
          PROJECT: robtic-landing
          # service=image, space separated
          SERVICES: "robtic-landing=ghcr.io/robticorg/robtic-landing:production"
        run: |
          set -euo pipefail
          if ! docker info >/dev/null 2>&1; then
            # Until the runner's user may use Docker, fall back to Portainer's webhook (it may pull late).
            echo "::warning::The runner can't use Docker yet (sudo usermod -aG docker github && sudo systemctl restart 'actions.runner.*'); calling Portainer's webhook instead."
            if [ -z "$WEBHOOK" ]; then echo "::error::PORTAINER_WEBHOOK is not set — image pushed, nothing redeployed."; exit 1; fi
            curl --fail-with-body -sSk -X POST --max-time 300 "$WEBHOOK"
            exit 0
          fi
          # A login that lives only for this job.
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          names=""
          for pair in $SERVICES; do
            docker pull -q "${pair#*=}" >/dev/null
            names="$names ${pair%%=*}"
          done
          # The stack's files live in Portainer's volume; compose runs in a container that can read it.
          compose() {
            docker run --rm -v portainer_data:/data:ro -v /var/run/docker.sock:/var/run/docker.sock -w "$STACK_DIR" \
              docker:27-cli sh -c 'ef=""; [ -f stack.env ] && ef="--env-file stack.env"; exec docker compose -p "$0" -f docker-compose.yml $ef "$@"' "$PROJECT" "$@"
          }
          compose up -d --no-deps --pull never $names
          for pair in $SERVICES; do
            svc="${pair%%=*}"; want="$(docker image inspect -f '{{.Id}}' "${pair#*=}")"
            for i in $(seq 1 60); do
              id="$(docker ps -q --filter "label=com.docker.compose.project=$PROJECT" --filter "label=com.docker.compose.service=$svc" | head -1)"
              if [ -n "$id" ]; then
                img="$(docker inspect -f '{{.Image}}' "$id")"
                health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$id")"
                if [ "$img" = "$want" ] && { [ "$health" = healthy ] || [ "$health" = running ]; }; then echo "$svc is running the new image ($health)"; continue 2; fi
              fi
              sleep 3
            done
            echo "::error::$svc is not running the new image after 3 minutes"
            exit 1
          done

  notify:
    name: Deploy notification
    needs: [build, redeploy]
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          RESULT: ${{ needs.redeploy.result == 'success' && 'success' || 'failure' }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "DISCORD_WEBHOOK_DEPLOY is not set — skipping."; exit 0; }
          PAYLOAD=$(jq -n --arg repo "$REPO" --arg sha "${SHA:0:7}" --arg result "$RESULT" --arg url "$RUN_URL"             '{username: "Robtic Deploy", embeds: [{title: "\($repo) → robtic-landing: \($result)", url: $url,
              description: "Image `sha-\($sha)` · stack webhook called", color: (if $result == "success" then 3066993 else 15158332 end)}]}')
          curl --fail-with-body -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
