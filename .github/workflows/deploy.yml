name: Build and deploy

# Push to main -> build the image, push ghcr.io/robticorg/robtic-landing:production (+ a short-sha tag),
# then ping the Portainer stack's auto-update webhook so the host re-pulls and redeploys. Mirrors the other
# robticorg services.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/robticorg/robtic-landing
          tags: |
            type=raw,value=production
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The runner on the server (192.168.1.137) pulls the new private image from ghcr and recreates the container in
  # the compose project it already runs in (the Portainer stack's), so it starts on the new :production.
  redeploy:
    name: Redeploy on the server
    needs: build
    runs-on: [self-hosted, robtic-deploy]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and recreate
        env:
          CONTAINER: robtic-landing
        run: |
          set -eu
          # Keep the project the container already belongs to (the Portainer stack), else the compose file's own name.
          project=$(docker inspect "$CONTAINER" --format '{{ index .Config.Labels "com.docker.compose.project" }}' 2>/dev/null || true)
          echo "Running in project: ${project:-<none>}"
          args="-f infra/compose.yml"
          [ -n "$project" ] && args="$args -p $project"
          docker compose $args pull
          docker compose $args up -d --remove-orphans
          docker inspect "$CONTAINER" --format 'Now running {{ .Config.Image }} ({{ .Image }}), started {{ .State.StartedAt }}'

      - name: Log out of ghcr
        if: always()
        run: docker logout ghcr.io
