name: Build and deploy

# Push to main -> build the image, push ghcr.io/robticorg/robtic-landing:production (+ a short-sha tag),
# then ping the Portainer stack's auto-update webhook so the host re-pulls and redeploys. Mirrors the other
# robticorg services.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/robticorg/robtic-landing
          tags: |
            type=raw,value=production
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Portainer re-pulls `:production` and recreates robtic-landing if its image changed — the same as the bots
  # (robtic-staff, robtic-shop…). The webhook is reachable on the LAN only, so this runs on the self-hosted runner on
  # the server (192.168.1.137). PORTAINER_WEBHOOK is this repo's secret: the robtic-landing stack's webhook URL.
  redeploy:
    name: Redeploy robtic-landing
    needs: build
    runs-on: [self-hosted, robtic-deploy]
    steps:
      - name: Call the Portainer stack webhook
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::PORTAINER_WEBHOOK is not set — image pushed, nothing redeployed."
            exit 1
          fi
          # Portainer serves a self-signed certificate on :9443.
          curl --fail-with-body -sSk -X POST --max-time 300 "$WEBHOOK"

  notify:
    name: Deploy notification
    needs: [build, redeploy]
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          RESULT: ${{ needs.redeploy.result == 'success' && 'success' || 'failure' }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "DISCORD_WEBHOOK_DEPLOY is not set — skipping."; exit 0; }
          PAYLOAD=$(jq -n --arg repo "$REPO" --arg sha "${SHA:0:7}" --arg result "$RESULT" --arg url "$RUN_URL"             '{username: "Robtic Deploy", embeds: [{title: "\($repo) → robtic-landing: \($result)", url: $url,
              description: "Image `sha-\($sha)` · stack webhook called", color: (if $result == "success" then 3066993 else 15158332 end)}]}')
          curl --fail-with-body -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
