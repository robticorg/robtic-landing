name: Build and deploy

# Push to main -> build the image, push ghcr.io/robticorg/robtic-landing:production (+ a short-sha tag),
# then ping the Portainer stack's auto-update webhook so the host re-pulls and redeploys. Mirrors the other
# robticorg services.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/robticorg/robtic-landing
          tags: |
            type=raw,value=production
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Portainer re-pulls :production and recreates the stack. Its webhook is reachable on the LAN only (:9443,
  # self-signed), so this runs on the self-hosted runner on 192.168.1.137 — the same pattern as robtic-admin.
  # (It used to be a step on the GitHub runner whose `if` read the step's own env, which is always empty there,
  # so it was always skipped.)
  redeploy:
    name: Redeploy via Portainer
    needs: build
    runs-on: [self-hosted, robtic-deploy]
    steps:
      - name: Call the Portainer stack webhook
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::PORTAINER_WEBHOOK is not set — image pushed, nothing redeployed."
            exit 0
          fi
          curl --fail-with-body -sSk -X POST --max-time 300 "$WEBHOOK"
