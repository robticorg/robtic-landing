name: Build and deploy

# Push to main -> build the image, push ghcr.io/robticorg/robtic-landing:production (+ a short-sha tag),
# then ping the Portainer stack's auto-update webhook so the host re-pulls and redeploys. Mirrors the other
# robticorg services.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/robticorg/robtic-landing
          tags: |
            type=raw,value=production
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer redeploy
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        if: ${{ env.PORTAINER_WEBHOOK != '' }}
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK"
